name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/client/src/**'
      - 'packages/server/src/**'
      - 'packages/react/src/**'
      - 'packages/shared/src/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run build:docs

      - name: Commit and push rebuilt docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to the built docs. Skipping commit."
            exit 0
          fi
          git commit -m "chore(docs): rebuild static site [skip ci]"
          git push origin HEAD:main
