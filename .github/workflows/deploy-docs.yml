name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/client/src/**'
      - 'packages/server/src/**'
      - 'packages/react/src/**'
      - 'packages/shared/src/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # The adapter workspaces are submodules; npm ci needs their package.json to
          # match the root lockfile. All submodule repositories are public over HTTPS.
          submodules: recursive
          # Full history: the docs render "last updated" from git.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The API reference is generated from the packages' TypeScript sources, and
      # TypeDoc resolves `@docstack/shared` and `@docstack/abe` through their `main`
      # and `types` entries - which point into `lib/` and exist only once those
      # packages are built. `npm ci` builds nothing, so without this step TypeDoc
      # emits no markdown for client and react, and the sidebar's `api/client/index`
      # reference then fails the build with "Invalid sidebars file".
      - name: Build the packages the API reference is generated from
        run: |
          npm run build:shared
          npm run build -w packages/abe
          npm run build:client
          npm run build:react

      - name: Build documentation site
        run: npm run build:docs

      - name: Commit and push rebuilt docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to the built docs. Skipping commit."
            exit 0
          fi
          git commit -m "chore(docs): rebuild static site [skip ci]"
          git push origin HEAD:main
