<html>
    <head>
        <title>DocStack Client Tests</title>
        <!-- Load vendor bundle with all external dependencies -->
        <script src="../test/vendor-bundle.js"></script>
        <!-- Load the DocStack UMD bundle -->
        <script src="../lib/index.js"></script>
    </head>
    <body>
        <h1>DocStack Client Tests</h1>
        <p>UMD Bundle loaded. Check console for DocStack library.</p>
        <p>DocStack Library (UMD): <code id="umd-result">Loading...</code></p>
    </body>
    <script>
        // Test UMD bundle
        console.log("DocStack (UMD):", window.docstack || typeof docstack);
        document.getElementById('umd-result').textContent = typeof docstack !== 'undefined' ? 'Loaded ✓' : 'Failed ✗';
    </script>
    <script>
        // Initialize DocStack with a stack instance and log the result
        (async () => {
            try {
                const DocStack = window.docstack.DocStack;
                const docStack = new DocStack({
                    name: "TestStack",
                })
                const onReady = () => {
                    console.log("DocStack is ready:", docStack);
                    docStack.removeEventListener("ready", onReady);
                };
                docStack.addEventListener("ready", onReady);
            } catch (error) {
                console.error("Error initializing DocStack:", error);
            }
        })();
    </script>
</html>
